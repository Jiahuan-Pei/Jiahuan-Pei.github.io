name: Update Publications

on:
  push:
    paths:
      - "markdown_generator/citations.csv"   # trigger when you commit a new export
  workflow_dispatch:                           # or trigger manually from GitHub UI

permissions:
  contents: write

jobs:
  update-pubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Convert citations.csv → publications.json
        run: python markdown_generator/fetch_publications_json.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/js/publications.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: auto-update publications from citations.csv [skip ci]"
            git push
          fi
